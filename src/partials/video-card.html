<li class="w-[72%] shrink-0 snap-start sm:w-[46%] md:w-auto">
  <a class="lift group block h-full" href="{{URL}}" target="_blank" rel="noopener noreferrer" data-video data-video-id="{{VIDEO_ID}}" data-platform="{{PLATFORM}}" aria-label="Watch {{TITLE}} on {{PLATFORM}} (opens in a new tab)">
    <span class="relative block aspect-[9/16] overflow-hidden rounded-2xl bg-deep">
      <picture>
        <source type="image/avif" srcset="{{AVIF_SRCSET}}" sizes="(min-width: 768px) 30vw, 72vw">
        <source type="image/webp" srcset="{{WEBP_SRCSET}}" sizes="(min-width: 768px) 30vw, 72vw">
        <img src="{{JPG_SRC}}" srcset="{{JPG_SRCSET}}" sizes="(min-width: 768px) 30vw, 72vw" width="360" height="640" alt="{{ALT}}" loading="{{LOADING}}" decoding="async"{{PRIORITY}} class="h-full w-full object-cover">
      </picture>
      <span class="pointer-events-none absolute inset-0 flex items-center justify-center" aria-hidden="true">
        <span class="flex h-12 w-12 items-center justify-center rounded-full bg-paper">
          <span class="ml-1 block h-0 w-0 border-y-[8px] border-l-[14px] border-y-transparent border-l-deep"></span>
        </span>
      </span>
    </span>
    <span class="mt-3 block text-sm font-semibold uppercase tracking-wider text-deep">{{PLACE}}</span>
    <span class="mt-2 block font-display text-xl font-semibold leading-snug text-ink">{{TITLE}}</span>
    <span class="mt-2 block text-base leading-relaxed text-muted">{{DESCRIPTION}}</span>
    {{STAT_HTML}}
    <span class="mt-2 inline-flex min-h-11 items-center text-sm font-semibold text-ink">{{PLATFORM}}</span>
  </a>
</li>
