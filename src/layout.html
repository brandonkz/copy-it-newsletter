<!DOCTYPE html>
<html lang="en" data-ga4="{{GA4_ID}}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {{GA_SNIPPET}}
    <meta name="format-detection" content="telephone=no">
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}">
    <meta name="robots" content="{{ROBOTS}}">
    <link rel="canonical" href="{{CANONICAL}}">
    <meta name="theme-color" content="#1F4FFF">
    <meta name="color-scheme" content="light">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Copy It">
    <meta property="og:locale" content="en_ZA">
    <meta property="og:title" content="{{TITLE}}">
    <meta property="og:description" content="{{DESCRIPTION}}">
    <meta property="og:url" content="{{CANONICAL}}">
    <meta property="og:image" content="{{OG_IMAGE}}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="{{OG_ALT}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{TITLE}}">
    <meta name="twitter:description" content="{{DESCRIPTION}}">
    <meta name="twitter:image" content="{{OG_IMAGE}}">
    <meta name="twitter:image:alt" content="{{OG_ALT}}">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
    <link rel="stylesheet" href="{{CSS}}">
  </head>
  <body class="bg-white font-sans text-base text-ink antialiased">
    <a class="skip-link" href="#content">Skip to content</a>
    {{HEADER}}
    <main id="content">
      {{CONTENT}}
    </main>
    {{FOOTER}}
    <script src="{{JS}}" defer></script>
  </body>
</html>
